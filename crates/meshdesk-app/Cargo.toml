[package]
name = "meshdesk-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
test = false
doctest = false

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
meshdesk-core = { path = "../meshdesk-core" }
meshdesk-identity = { path = "../meshdesk-identity" }
meshdesk-storage = { path = "../meshdesk-storage" }
meshdesk-protocol = { path = "../meshdesk-protocol" }
meshdesk-discovery = { path = "../meshdesk-discovery" }
meshdesk-stream = { path = "../meshdesk-stream" }
meshdesk-signaling = { path = "../meshdesk-signaling" }
tauri = { version = "2.2", features = [] }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
uuid.workspace = true
blake3.workspace = true
base64 = "0.22"
log.workspace = true
env_logger.workspace = true

[workspace]
resolver = "2"
members = [
    "crates/meshdesk-core",
    "crates/meshdesk-identity",
    "crates/meshdesk-storage",
    "crates/meshdesk-protocol",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["MeshDesk Engineering Team"]
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.40", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
blake3 = "1.5"
log = "0.4"
env_logger = "0.11"
